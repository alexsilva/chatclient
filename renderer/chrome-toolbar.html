<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatClient Toolbar</title>
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div class="toolbar-shell" aria-label="Ações do ChatClient">
    <div class="mode-pill" id="modeLabel">ChatGPT</div>
    <button class="tool-button active" id="quimeraButton" aria-pressed="true" title="Auto-aprovar Quimera" aria-label="Auto-aprovar Quimera">
      <svg class="quimera-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </button>
    <button class="tool-button" id="refreshButton" title="Recarregar (F5)" aria-label="Recarregar">↻</button>
  </div>
  <script src="chrome-toolbar.js"></script>
</body>
</html>
